services:
  request-service:
    build: ./request-service
    container_name: request-service
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  dispatch-service:
    build: ./dispatch-service
    container_name: dispatch-service
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  request-sidecar:
    build: ./request-sidecar
    container_name: request-sidecar
    ports:
      - "4003:4000"
    depends_on:
      request-service:
        condition: service_healthy
