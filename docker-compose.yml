services:
  dispatch-service:
    build: ./dispatch-service
    container_name: dispatch-service
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  request-sidecar:
    build: ./request-sidecar
    container_name: request-sidecar
    ports:
      - "4003:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      request-service-1:
        condition: service_healthy
      request-service-2:
        condition: service_healthy

  request-service-1:
    build: ./request-service
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      FAULT_DELAY_MS: 5000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  request-service-2:
    build: ./request-service
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      FAULT_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  caddy:
    build: ./caddy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/requests"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      request-service-1:
        condition: service_healthy
      request-service-2:
        condition: service_healthy

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  async-worker:
    build: ./async-worker
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy

  prometheus:
    build: ./prometheus
    ports:
      - "9090:9090"
    depends_on:
      request-service-1:
        condition: service_healthy
      request-service-2:
        condition: service_healthy
